<div class="confirm-backdrop" role="presentation" (click)="cancelled.emit()">
  <article
    class="confirm-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirmation-popup-title"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()">
    <header class="confirm-header">
      <span class="confirm-icon material-symbols-rounded" aria-hidden="true">warning</span>
      <div>
        <h2 id="confirmation-popup-title">{{ title }}</h2>
        <p>{{ message }}</p>
      </div>
    </header>

    <footer class="confirm-actions">
      <button type="button" class="ghost-button icon-text-button" (click)="cancelled.emit()">
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
        Cancel
      </button>
      <button type="button" class="danger-button icon-text-button" (click)="confirmed.emit()">
        <span class="material-symbols-rounded" aria-hidden="true">check</span>
        {{ confirmLabel }}
      </button>
    </footer>
  </article>
</div>
