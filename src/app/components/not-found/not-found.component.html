<div class="not-found-container">
  <div class="not-found-content">
    <!-- Animated 404 -->
    <div class="error-code">
      <span class="digit">4</span>
      <span class="digit zero">
        <span class="zero-inner">0</span>
      </span>
      <span class="digit">4</span>
    </div>

    <!-- Message -->
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">
      Oops! The page you're looking for seems to have wandered off.
      <br />
      Let's get you back on track.
    </p>

    <!-- Actions -->
    <div class="error-actions">
      <a routerLink="/" class="btn btn-primary">
        <svg class="btn-icon" lucideIcon="house" aria-hidden="true"></svg>
        Go Home
      </a>
      <a routerLink="/calendar" class="btn btn-secondary">
        <svg class="btn-icon" lucideIcon="calendar-days" aria-hidden="true"></svg>
        View Calendar
      </a>
    </div>

    <!-- Fun element -->
    <div class="lost-illustration">
      <svg class="emoji" lucideIcon="search" aria-hidden="true"></svg>
    </div>
  </div>

  <!-- Background decoration -->
  <div class="bg-decoration">
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    <div class="bg-circle circle-3"></div>
  </div>
</div>
